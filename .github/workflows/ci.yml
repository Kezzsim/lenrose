name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Deterministic, self-contained credentials shared by the stack.
      TYPESENSE_API_KEY: secret
      TILED_API_KEY: secret
      # Test-time connection settings (services published on localhost).
      TYPESENSE_HOST: localhost
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      LENROSE_TILED_URI: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      # Stand up the exact same self-contained stack developers use locally.
      # docker compose is preinstalled on GitHub runners. Using compose (rather
      # than GitHub `services:`) lets each container manage its own data
      # directory, so no host "/data" mount is required.
      - name: Start services (Typesense + Tiled)
        run: docker compose up -d --wait

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down services
        if: always()
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/lenrose/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run frontend tests
        run: npm run test

