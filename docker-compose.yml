services:
  typesense:
    image: typesense/typesense:27.1
    restart: on-failure
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    command: >-
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-secret}
      --enable-cors
    healthcheck:
      # The Typesense image ships neither curl nor wget, so probe the health
      # endpoint using bash's built-in /dev/tcp support.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3; grep -q '\"ok\":true' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  tiled:
    # Official Tiled image, made self-contained via a baked-in config and
    # bootstrap script. No host bind mounts or pre-existing directories are
    # required: the catalog and example data live on the container's own
    # writable filesystem.
    image: ghcr.io/bluesky/tiled:latest
    restart: on-failure
    # Run as root so the bootstrap script can populate the writable data
    # volume (the base image runs as an unprivileged "app" user by default).
    user: root
    ports:
      - "8000:8000"
    environment:
      TILED_API_KEY: ${TILED_API_KEY:-secret}
    volumes:
      - ./deploy/tiled/config.yml:/deploy/config.yml:ro
      - ./deploy/tiled/entrypoint.sh:/deploy/entrypoint.sh:ro
      - tiled-data:/deploy/data
    entrypoint: ["/deploy/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  typesense-data:
  tiled-data:
