[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lenrose"
version = "0.1.0"
description = "Lenrose - Scientific Metadata Search Engine for Bluesky Tiled"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "NSLS-II" }]
dependencies = [
    "tiled[client]>=0.1.0",
    "typesense>=0.21.0",
    "textual>=0.80.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-vcr>=1.0.2",
    "pytest-asyncio>=0.24.0",
    "vcrpy>=6.0.0",
]

[project.scripts]
lenrose = "lenrose.__main__:main"
lenrose-tui = "lenrose.tui.app:run"
lenrose-serve = "lenrose.server.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/lenrose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
